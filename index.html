<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京福バス 70・71系統 いまどこ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<meta name="theme-color" content="#7a1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f1f2ef; --panel:#ffffff; --ink:#1b1b19; --ink2:#62625c; --ink3:#8f8f88; --line:#e1e1db;
  --wine:#7a1f2e; --wine-ink:#fff; --taupe:#5f554b; --taupe-ink:#fff;
  --ok:#2f7a45; --ok-bg:#e4f3e8; --late:#a65b00; --late-bg:#fdefd8; --vlate:#b4262a; --vlate-bg:#fbe3e3; --early:#1f58c7; --early-bg:#e3ebfb;
  --shadow:0 1px 2px rgba(20,20,10,.06), 0 6px 18px rgba(20,20,10,.06);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141412; --panel:#1f1f1c; --ink:#f0efea; --ink2:#b3b2aa; --ink3:#7d7d75; --line:#33332f;
  --wine:#8e2a3b; --taupe:#6a5f55;
  --ok:#7fd196; --ok-bg:#1d3324; --late:#f0b05a; --late-bg:#3a2a12; --vlate:#f08a8d; --vlate-bg:#3d1b1c; --early:#8fb2ff; --early-bg:#1b2a48;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--bg)}
header h1{font-size:15px;font-weight:700;margin:0;flex:1;letter-spacing:.04em;color:var(--ink2)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;padding:5px 14px;font-size:13px;background:transparent;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
#refreshBtn{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1}
#refreshBtn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#refreshBtn.spin{animation:none}}

main{flex:1;overflow:auto;padding:4px 14px 28px;display:flex;flex-direction:column;gap:18px;width:100%;max-width:1040px;margin:0 auto}
.status{font-size:12.5px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 4px}
.msg{background:var(--late-bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.msg.err{background:var(--vlate-bg)}
section h2{font-size:12.5px;margin:0 0 8px 4px;color:var(--ink3);font-weight:700;letter-spacing:.06em}

/* ---- the two boarding cards ---- */
.home{display:grid;gap:14px}
.card{background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.card .sign{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--wine);color:var(--wine-ink)}
.card.alt .sign{background:var(--taupe);color:var(--taupe-ink)}
.card .sign .num{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1;min-width:48px}
.card .sign .route{display:flex;flex-direction:column;line-height:1.25}
.card .sign .stop{font-size:19px;font-weight:700}
.card .sign .to{font-size:12.5px;opacity:.82}
.card .body{padding:14px 16px 16px}
.card .next{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.card .count{display:flex;align-items:baseline;gap:4px;line-height:1}
.card .count .pre{font-size:15px;color:var(--ink2);font-weight:700}
.card .count .big{font-size:64px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.card .count .unit{font-size:20px;font-weight:700}
.card .count.soon .big{font-size:40px;color:var(--wine)}
.card.alt .count.soon .big{color:var(--taupe)}
.card .meta{font-size:14px;color:var(--ink2);line-height:1.6;flex:1;min-width:150px}
.card .meta .dep{font-size:17px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.card .meta .dep s{font-weight:500;color:var(--ink3);font-size:14px;margin-right:6px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;vertical-align:middle;margin-left:6px}
.chip.d-ok{background:var(--ok-bg);color:var(--ok)} .chip.d-late{background:var(--late-bg);color:var(--late)}
.chip.d-vlate{background:var(--vlate-bg);color:var(--vlate)} .chip.d-early{background:var(--early-bg);color:var(--early)}
.chip.d-na{background:var(--bg);color:var(--ink3)}
.card .where{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--ink2)}
.card .where .dot{width:10px;height:10px;border-radius:50%;background:var(--wine);box-shadow:0 0 0 3px color-mix(in srgb,var(--wine) 22%,transparent);flex:none}
.card.alt .where .dot{background:var(--taupe);box-shadow:0 0 0 3px color-mix(in srgb,var(--taupe) 22%,transparent)}
.card .where .dot.off{background:var(--ink3);box-shadow:none}
.card .later{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
.card .later b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;margin-left:4px}
.card .none{font-size:15px;color:var(--ink2)}
.card .none b{color:var(--ink);font-size:18px}

/* ---- running buses ---- */
.bus{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:28px;padding:0 8px;border-radius:8px;
  background:var(--wine);color:#fff;font-weight:900;font-size:15px}
.badge.alt{background:var(--taupe)}
.bus .dest{font-weight:700}
.bus .sub{font-size:13px;color:var(--ink2)}
.delay{font-weight:900;font-size:19px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.delay small{display:block;font-size:11px;font-weight:500;color:var(--ink3)}
.d-ok{color:var(--ok)} .d-late{color:var(--late)} .d-vlate{color:var(--vlate)} .d-early{color:var(--early)} .d-na{color:var(--ink3)}

details.mapwrap summary,details.settings summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:6px 4px;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋";display:inline-block;width:18px;color:var(--ink3)}
details[open] summary::before{content:"－"}
#map{height:36vh;min-height:240px;border-radius:14px;overflow:hidden;margin-top:6px;background:#e6e8e4}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--ink2)}
select,input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:100%}
.controls button{border-radius:10px;font-weight:500}
.empty{color:var(--ink3);font-size:14px;padding:6px 4px}
.busmarker{background:var(--wine);color:#fff;font-weight:900;font-size:12px;border-radius:14px;padding:2px 8px;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap;line-height:1.3}
.busmarker.alt{background:var(--taupe)}
.busmarker span{font-weight:500;font-size:11px;opacity:.95}
footer{font-size:11px;color:var(--ink3);padding:0 16px 12px;max-width:1040px;margin:0 auto;width:100%}
@media (min-width:760px){ .home{grid-template-columns:1fr 1fr} #map{height:440px} .card .count .big{font-size:72px} }
</style>
</head>
<body>
<header>
  <h1>京福バス いまどこ</h1>
  <div class="seg" role="group" aria-label="行きと帰り"><button id="modeGo">行き</button><button id="modeBack">帰り</button></div>
  <button id="refreshBtn" title="今すぐ更新" aria-label="今すぐ更新">↻</button>
</header>
<main>
  <div class="status"><span id="statusText">準備中…</span><span id="updatedAt"></span></div>
  <div id="msg" hidden></div>

  <div class="home" id="home"></div>

  <section>
    <h2>いま走っている 70・71</h2>
    <div id="busList"><div class="empty">読み込み中…</div></div>
  </section>

  <details class="mapwrap" id="mapwrap">
    <summary>地図を見る</summary>
    <div id="map" role="img" aria-label="バスの現在地マップ"></div>
  </details>

  <details class="settings">
    <summary>設定</summary>
    <div class="controls">
      <label>70 の最寄 <input id="stop70" value="種池" size="8"></label>
      <label>71 の最寄 <input id="stop71" value="江守中" size="8"></label>
      <label>帰りの乗車 <input id="hubStop" value="福井駅" size="8"></label>
      <label>更新間隔 <select id="intervalSel"><option value="15">15秒</option><option value="30" selected>30秒</option><option value="60">60秒</option></select></label>
      <button id="reloadStatic">時刻表データを取り直す</button>
      <button id="showRoutes">系統一覧</button>
      <input id="routesInput" type="hidden" value="70,71">
    </div>
  </details>
</main>
<footer>データ：公共交通オープンデータセンター（京福バス GTFS / GTFS-RT, CC BY 4.0）・地図 © OpenStreetMap contributors</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
'use strict';
const BASE = 'https://api-public.odpt.org/api/v4';
const URL_STATIC = BASE + '/files/odpt/KeifukuBus/keifuku_rosen.zip?date=current';
const URL_VEH = BASE + '/gtfs/realtime/odpt_KeifukuBus_keifuku_rosen_vehicle';
const URL_TU  = BASE + '/gtfs/realtime/odpt_KeifukuBus_keifuku_rosen_trip_update';
const CACHE_KEY = 'kfbus_static_v1';
const PREF_KEY  = 'kfbus_pref_v1';

const $ = id => document.getElementById(id);
const pref = loadPref();
$('routesInput').value = pref.routes.join(',');
$('intervalSel').value = String(pref.interval);
$('stop70').value = pref.stops['70'] || '種池';
$('stop71').value = pref.stops['71'] || '江守中';
$('hubStop').value = pref.hub;

// ---------- state ----------
let S = null;            // static subset: {fetched, routes:{route_id:{short,long}}, trips:{}, stops:{}, shapes:{}, cal, calDates, targets}
let map, busLayer, stopLayer, shapeLayer;
let timer = null;
let lastVeh = [], lastTU = {};

// ---------- helpers ----------
function loadPref(){
  try{ const p = JSON.parse(localStorage.getItem(PREF_KEY)||'{}');
    return { routes:(p.routes&&p.routes.length)?p.routes:['70','71'], interval:p.interval||30, stops:p.stops||{'70':'種池','71':'江守中'}, hub:p.hub||'福井駅', mode:p.mode||'auto' };
  }catch(e){ return {routes:['70','71'],interval:30,stops:{'70':'種池','71':'江守中'},hub:'福井駅',mode:'auto'}; }
}
function savePref(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(pref)); }catch(e){} }
function setStatus(t){ $('statusText').textContent = t; }
function showMsg(t, err){ const m=$('msg'); m.textContent=t; m.className='msg'+(err?' err':''); m.hidden=false; }
function hideMsg(){ $('msg').hidden=true; }
function hhmm(d){ return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function parseGtfsTime(t){ // "25:10:00" -> seconds since local midnight of service day
  const a=t.split(':'); return (+a[0])*3600+(+a[1])*60+(+(a[2]||0)); }
function fmtSec(sec){ const h=Math.floor(sec/3600)%24, m=Math.floor(sec%3600/60); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function yyyymmdd(d){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }

// CSV (RFC4180-ish) -> array of objects
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c!=='\r') field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const head=rows[0].map(h=>h.replace(/^\ufeff/,'').trim());
  const out=[]; for(let r=1;r<rows.length;r++){ if(rows[r].length<2) continue; const o={}; head.forEach((h,i)=>o[h]=rows[r][i]??''); out.push(o); }
  return out;
}

// ---------- minimal protobuf (GTFS-RT) ----------
function pbFields(buf){ // returns [{f, wt, v}] ; v = BigInt for varint/64/32, Uint8Array for len-delimited
  const out=[]; let i=0;
  while(i<buf.length){
    let key=0n, shift=0n, b;
    do{ b=buf[i++]; key|=BigInt(b&0x7f)<<shift; shift+=7n; }while(b&0x80);
    const f=Number(key>>3n), wt=Number(key&7n);
    if(wt===0){ let v=0n; shift=0n; do{ b=buf[i++]; v|=BigInt(b&0x7f)<<shift; shift+=7n; }while(b&0x80); out.push({f,wt,v}); }
    else if(wt===1){ out.push({f,wt,v:buf.subarray(i,i+8)}); i+=8; }
    else if(wt===5){ out.push({f,wt,v:buf.subarray(i,i+4)}); i+=4; }
    else if(wt===2){ let len=0n; shift=0n; do{ b=buf[i++]; len|=BigInt(b&0x7f)<<shift; shift+=7n; }while(b&0x80); const n=Number(len); out.push({f,wt,v:buf.subarray(i,i+n)}); i+=n; }
    else throw new Error('unsupported wire type '+wt);
  }
  return out;
}
const td = new TextDecoder();
const str = v => td.decode(v);
const i32 = v => Number(BigInt.asIntN(32, v));
const u64 = v => Number(v);
const f32 = v => new DataView(v.buffer, v.byteOffset, 4).getFloat32(0, true);

function decodeTripDesc(buf){ const t={}; for(const x of pbFields(buf)){ if(x.f===1)t.trip_id=str(x.v); else if(x.f===5)t.route_id=str(x.v); else if(x.f===6)t.direction_id=u64(x.v); else if(x.f===2)t.start_time=str(x.v); else if(x.f===3)t.start_date=str(x.v);} return t; }
function decodeSTE(buf){ const e={}; for(const x of pbFields(buf)){ if(x.f===1)e.delay=i32(x.v); else if(x.f===2)e.time=u64(x.v);} return e; }
function decodeSTU(buf){ const s={}; for(const x of pbFields(buf)){ if(x.f===1)s.stop_sequence=u64(x.v); else if(x.f===4)s.stop_id=str(x.v); else if(x.f===2)s.arrival=decodeSTE(x.v); else if(x.f===3)s.departure=decodeSTE(x.v);} return s; }
function decodeTU(buf){ const t={stu:[]}; for(const x of pbFields(buf)){ if(x.f===1)t.trip=decodeTripDesc(x.v); else if(x.f===2)t.stu.push(decodeSTU(x.v)); else if(x.f===4)t.timestamp=u64(x.v); else if(x.f===5)t.delay=i32(x.v); else if(x.f===3){ for(const y of pbFields(x.v)){ if(y.f===1)t.vehicle_id=str(y.v); if(y.f===2)t.vehicle_label=str(y.v);} } } return t; }
function decodeVP(buf){ const v={}; for(const x of pbFields(buf)){
  if(x.f===1)v.trip=decodeTripDesc(x.v);
  else if(x.f===2){ for(const y of pbFields(x.v)){ if(y.f===1)v.lat=f32(y.v); else if(y.f===2)v.lon=f32(y.v); else if(y.f===3)v.bearing=f32(y.v);} }
  else if(x.f===3)v.current_stop_sequence=u64(x.v);
  else if(x.f===4)v.current_status=u64(x.v);
  else if(x.f===5)v.timestamp=u64(x.v);
  else if(x.f===7)v.stop_id=str(x.v);
  else if(x.f===8){ for(const y of pbFields(x.v)){ if(y.f===1)v.vehicle_id=str(y.v); if(y.f===2)v.vehicle_label=str(y.v);} }
} return v; }
function decodeFeed(buf){ const ents=[]; for(const x of pbFields(buf)){ if(x.f===2){ const e={}; for(const y of pbFields(x.v)){ if(y.f===1)e.id=str(y.v); else if(y.f===3)e.trip_update=decodeTU(y.v); else if(y.f===4)e.vehicle=decodeVP(y.v);} ents.push(e);} } return ents; }

// ---------- static GTFS ----------
async function loadStatic(force){
  const targets = pref.routes;
  if(!force){
    try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(c && c.v===1 && JSON.stringify(c.targets)===JSON.stringify(targets) && Date.now()-c.fetched < 7*86400e3){ S=c; return; }
    }catch(e){}
  }
  setStatus('時刻表データを取得中…（初回のみ数MB）');
  const res = await fetch(URL_STATIC);
  if(!res.ok) throw new Error('時刻表データの取得に失敗 HTTP '+res.status);
  const zip = await JSZip.loadAsync(await res.arrayBuffer());
  const read = async n => { const f=zip.file(n); return f? parseCSV(await f.async('string')) : []; };

  const routesAll = await read('routes.txt');
  const routes={};
  for(const r of routesAll){
    const sn=(r.route_short_name||'').trim();
    const hit = targets.some(t => sn===t || (!sn && (r.route_id.includes(t)||(r.route_long_name||'').includes(t))));
    if(hit) routes[r.route_id]={short:sn||targets.find(t=>r.route_id.includes(t)||(r.route_long_name||'').includes(t)), long:r.route_long_name||''};
  }
  const allShort=[...new Set(routesAll.map(r=>(r.route_short_name||'').trim()||r.route_id))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
  if(!Object.keys(routes).length) throw new Error('系統「'+targets.join(',')+'」が時刻表データに見つかりません。設定の「系統一覧」で表記を確認してください。候補: '+allShort.slice(0,60).join(' '));

  const trips={}; const shapeIds=new Set(); const serviceIds=new Set();
  for(const t of await read('trips.txt')){
    if(!routes[t.route_id]) continue;
    trips[t.trip_id]={route_id:t.route_id, headsign:t.trip_headsign||'', dir:t.direction_id||'', service_id:t.service_id, shape_id:t.shape_id||'', stops:[]};
    if(t.shape_id) shapeIds.add(t.shape_id); serviceIds.add(t.service_id);
  }
  const stopIds=new Set();
  for(const s of await read('stop_times.txt')){
    const t=trips[s.trip_id]; if(!t) continue;
    t.stops.push([s.stop_id, +s.stop_sequence, parseGtfsTime(s.departure_time||s.arrival_time)]); stopIds.add(s.stop_id);
  }
  for(const t of Object.values(trips)) t.stops.sort((a,b)=>a[1]-b[1]);
  const stops={};
  for(const s of await read('stops.txt')){ if(stopIds.has(s.stop_id)) stops[s.stop_id]={name:s.stop_name, lat:+s.stop_lat, lon:+s.stop_lon}; }
  const shapes={};
  for(const p of await read('shapes.txt')){ if(!shapeIds.has(p.shape_id)) continue; (shapes[p.shape_id]=shapes[p.shape_id]||[]).push([+p.shape_pt_sequence,+p.shape_pt_lat,+p.shape_pt_lon]); }
  for(const k in shapes) shapes[k]=shapes[k].sort((a,b)=>a[0]-b[0]).map(x=>[x[1],x[2]]);
  const cal={}; for(const c of await read('calendar.txt')){ if(serviceIds.has(c.service_id)) cal[c.service_id]=c; }
  const calDates={}; for(const c of await read('calendar_dates.txt')){ if(serviceIds.has(c.service_id)) (calDates[c.date]=calDates[c.date]||{})[c.service_id]=c.exception_type; }

  S={v:1, fetched:Date.now(), targets, routes, trips, stops, shapes, cal, calDates, allShort};
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(S)); }catch(e){ console.warn('cache skipped', e); }
}

function serviceActive(service_id, dateStr, dow){
  const ex = S.calDates[dateStr] && S.calDates[dateStr][service_id];
  if(ex==='1') return true; if(ex==='2') return false;
  const c=S.cal[service_id]; if(!c) return false;
  if(dateStr<c.start_date||dateStr>c.end_date) return false;
  return c[['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][dow]]==='1';
}

// ---------- realtime ----------
async function fetchFeed(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status+' '+url.split('/').pop());
  return decodeFeed(new Uint8Array(await res.arrayBuffer()));
}
function delayOf(tu, stopSeq){
  if(!tu) return null;
  if(tu.stu.length){
    let pick = tu.stu.find(s => stopSeq!=null && s.stop_sequence!=null && s.stop_sequence>=stopSeq) || tu.stu[0];
    const e = pick.arrival && pick.arrival.delay!=null ? pick.arrival : (pick.departure && pick.departure.delay!=null ? pick.departure : null);
    if(e) return e.delay;
  }
  return tu.delay!=null ? tu.delay : null;
}
function delayClass(d){ if(d==null) return 'd-na'; if(d<-60) return 'd-early'; if(d<180) return 'd-ok'; if(d<600) return 'd-late'; return 'd-vlate'; }
function delayText(d){ if(d==null) return '―'; const m=Math.round(d/60); if(m===0) return '定刻'; return (m>0?'+':'')+m+'分'; }

async function refresh(){
  if(!S) return;
  setStatus('更新中…'); $('refreshBtn').classList.add('spin');
  try{
    const [veh, tus] = await Promise.all([fetchFeed(URL_VEH), fetchFeed(URL_TU)]);
    lastTU={}; for(const e of tus){ if(e.trip_update && e.trip_update.trip){ const t=e.trip_update.trip; if(t.trip_id) lastTU[t.trip_id]=e.trip_update; } }
    lastVeh = veh.filter(e=>e.vehicle && e.vehicle.trip && (S.trips[e.vehicle.trip.trip_id] || S.routes[e.vehicle.trip.route_id])).map(e=>e.vehicle);
    renderBuses(); renderBoard();
    hideMsg();
    const n=lastVeh.length;
    setStatus(n? n+'台 運行中' : '対象系統のバスは今走っていません');
    $('updatedAt').textContent = '更新 '+hhmm(new Date());
  }catch(err){
    console.error(err);
    showMsg('リアルタイム情報の取得に失敗しました: '+err.message+'（通信状態、または時間帯によりデータが無い場合があります）', true);
    setStatus('取得失敗');
  }
  $('refreshBtn').classList.remove('spin');
}

function renderBuses(){
  busLayer.clearLayers();
  const list=$('busList'); list.innerHTML='';
  if(!lastVeh.length){ list.innerHTML='<div class="empty">現在、対象系統で位置情報のあるバスはありません。</div>'; return; }
  const items = lastVeh.map(v=>{
    const trip=S.trips[v.trip.trip_id]||{};
    const route=S.routes[trip.route_id||v.trip.route_id]||{short:'?'};
    const tu=lastTU[v.trip.trip_id];
    const d=delayOf(tu, v.current_stop_sequence);
    let nextStop='';
    if(v.stop_id && S.stops[v.stop_id]) nextStop=S.stops[v.stop_id].name;
    else if(trip.stops && v.current_stop_sequence!=null){ const s=trip.stops.find(x=>x[1]===v.current_stop_sequence); if(s&&S.stops[s[0]]) nextStop=S.stops[s[0]].name; }
    const statusWord = v.current_status===1 ? 'に停車中' : (v.current_status===0 ? 'にまもなく到着' : 'へ向かっています');
    const sched = trip.stops && trip.stops.length ? fmtSec(trip.stops[0][2])+'発' : '';
    return {v,trip,route,d,nextStop,statusWord,sched};
  }).sort((a,b)=> (a.route.short.localeCompare(b.route.short,'ja',{numeric:true})) || (a.sched.localeCompare(b.sched)));

  const bounds=[];
  for(const it of items){
    const {v,trip,route,d,nextStop,statusWord,sched}=it;
    const alt = route.short!==pref.routes[0];
    const div=document.createElement('div'); div.className='bus';
    div.innerHTML = `<span class="badge${alt?' alt':''}">${esc(route.short)}</span>
      <div><div class="dest">${esc(trip.headsign||route.long||'')}</div>
        <div class="sub">${sched?esc(sched)+'　':''}${nextStop?esc(nextStop)+' '+statusWord:'位置情報のみ'}</div></div>
      <div class="delay ${delayClass(d)}">${delayText(d)}<small>${d==null?'遅れ情報なし':(v.timestamp?hhmm(new Date(v.timestamp*1000))+' 時点':'')}</small></div>`;
    list.appendChild(div);
    if(v.lat && v.lon){
      const icon=L.divIcon({className:'', html:`<div class="busmarker${alt?' alt':''}">${esc(route.short)} <span>${esc(delayText(d))}</span></div>`, iconAnchor:[20,12]});
      const m=L.marker([v.lat,v.lon],{icon}).addTo(busLayer);
      m.bindPopup(`<b>${esc(route.short)} ${esc(trip.headsign||'')}</b><br>${esc(nextStop)} ${statusWord}<br>遅れ: ${delayText(d)}`);
      bounds.push([v.lat,v.lon]);
    }
  }
}

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function serviceDay(){
  const now=new Date(); let secNow=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const sday=new Date(now); if(now.getHours()<3){ sday.setDate(sday.getDate()-1); secNow+=86400; }
  return {ds:yyyymmdd(sday), dow:sday.getDay(), secNow};
}
function statusLine(veh){
  if(!veh) return null;
  let ns='';
  if(veh.stop_id && S.stops[veh.stop_id]) ns=S.stops[veh.stop_id].name;
  else if(veh.current_stop_sequence!=null){ const t=S.trips[veh.trip.trip_id]; const s=t&&t.stops.find(x=>x[1]===veh.current_stop_sequence); if(s&&S.stops[s[0]]) ns=S.stops[s[0]].name; }
  if(!ns) return '運行中（位置あり）';
  if(veh.current_status===1) return ns+' に停車中';
  if(veh.current_status===0) return 'まもなく '+ns;
  return ns+' へ向かっています';
}
// departures of one route from stop `fromName`, arriving later at the first of `toNames`
function departures(routeShort, fromName, toNames, day, limit){
  const routeIds=Object.keys(S.routes).filter(id=>S.routes[id].short===routeShort);
  const byStop=S.stopIndex||buildStopIndex();
  const fromIds=Object.keys(S.stops).filter(id=>S.stops[id].name===fromName);
  const rows=[]; const seen=new Set();
  for(const sid of fromIds){
    for(const c of (byStop[sid]||[])){
      const trip=S.trips[c.trip_id]; if(!routeIds.includes(trip.route_id)) continue;
      if(seen.has(c.trip_id)) continue;
      if(!serviceActive(trip.service_id, day.ds, day.dow)) continue;
      // destination: first later stop whose name is in toNames; else terminus
      let dest=trip.stops.find(x=>x[1]>c.seq && toNames.includes((S.stops[x[0]]||{}).name));
      if(!dest){ if(toNames.length) continue; dest=trip.stops[trip.stops.length-1]; }
      seen.add(c.trip_id);
      const tu=lastTU[c.trip_id];
      const d=tu?delayOf(tu,c.seq):null;           // delay at boarding stop
      const dDest=tu?delayOf(tu,dest[1]):null;     // delay predicted at destination (falls back to trip delay)
      const est=c.time+(d||0);
      if(est < day.secNow-90) continue;
      rows.push({est, time:c.time, d, trip, veh:lastVeh.find(v=>v.trip.trip_id===c.trip_id),
        destName:(S.stops[dest[0]]||{}).name||'', destTime:dest[2], destEst:dest[2]+(dDest!=null?dDest:(d||0)), destD:dDest!=null?dDest:d});
    }
  }
  rows.sort((a,b)=>a.est-b.est);
  return {rows:rows.slice(0,limit), found:fromIds.length>0};
}
function currentMode(){ return pref.mode==='back'?'back':'go'; }
function renderHome(){
  const home=$('home'); home.innerHTML='';
  const mode=currentMode();
  $('modeGo').classList.toggle('on',mode==='go'); $('modeBack').classList.toggle('on',mode==='back');
  const day=serviceDay();
  const homeStops=Object.values(pref.stops).filter(Boolean);
  pref.routes.forEach((r,i)=>{
    const from = mode==='go' ? (pref.stops[r]||'') : pref.hub;
    const toNames = mode==='go' ? [pref.hub] : homeStops;
    const {rows,found}=departures(r, from, toNames, day, 3);
    const card=document.createElement('div'); card.className='card'+(i?' alt':'');
    let body='', toLabel = mode==='go'?pref.hub:(rows[0]?rows[0].destName:homeStops.join('／'));
    if(!found){ body=`<div class="none">「${esc(from)}」というバス停が時刻表に見つかりません。設定で確認してください。</div>`; }
    else if(!rows.length){
      const nd=new Date(); nd.setDate(nd.getDate()+1); const day2={ds:yyyymmdd(nd), dow:nd.getDay(), secNow:-1};
      const nx=departures(r, from, toNames, day2, 1).rows[0];
      body=`<div class="none">今日の便はもうありません${nx?`<br>明日の始発 <b>${fmtSec(nx.time)}</b>`:''}</div>`;
    } else {
      const n=rows[0]; const mins=Math.round((n.est-day.secNow)/60);
      const count = mins<=0 ? '<div class="count soon"><span class="big">まもなく</span></div>'
                            : `<div class="count"><span class="pre">あと</span><span class="big">${mins}</span><span class="unit">分</span></div>`;
      const chip = n.d==null ? '' : `<span class="chip ${delayClass(n.d)}">${delayText(n.d)}</span>`;
      const dep = n.d ? `<s>${fmtSec(n.time)}</s>${fmtSec(n.est)}発` : `${fmtSec(n.time)}発`;
      const arr = `${esc(n.destName)} 着 ${fmtSec(n.destEst)}` + (n.destD ? `（定刻 ${fmtSec(n.destTime)}）` : '');
      const st = statusLine(n.veh);
      const where = st ? `<div class="where"><span class="dot"></span>${esc(st)}</div>`
                       : `<div class="where"><span class="dot off"></span>まだ出発していません（定刻で表示）</div>`;
      body=`<div class="next">${count}<div class="meta"><div class="dep">${dep}${chip}</div>${arr}</div></div>${where}`;
      if(rows.length>1) body+=`<div class="later">${rows.slice(1).map(x=>`<span>次<b>${fmtSec(x.est)}</b>${x.d?' <span class="chip '+delayClass(x.d)+'">'+delayText(x.d)+'</span>':''}</span>`).join('')}</div>`;
    }
    card.innerHTML=`<div class="sign"><span class="num">${esc(r)}</span><div class="route"><span class="stop">${esc(from)}</span><span class="to">${esc(toLabel)} 行き</span></div></div><div class="body">${body}</div>`;
    home.appendChild(card);
  });
}
const renderBoard = renderHome;
function buildStopIndex(){
  const idx={};
  for(const [trip_id,t] of Object.entries(S.trips)){
    t.stops.forEach((s,i)=>{ (idx[s[0]]=idx[s[0]]||[]).push({trip_id, seq:s[1], time:s[2], last:i===t.stops.length-1}); });
  }
  S.stopIndex=idx; return idx;
}

// ---------- map & UI ----------
function initMap(){
  map=L.map('map',{zoomControl:true}).setView([36.064,136.22],12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  shapeLayer=L.layerGroup().addTo(map); stopLayer=L.layerGroup().addTo(map); busLayer=L.layerGroup().addTo(map);
}
function drawStatic(){
  shapeLayer.clearLayers(); stopLayer.clearLayers();
  const drawn=new Set(); const bounds=[];
  for(const t of Object.values(S.trips)){
    if(t.shape_id && S.shapes[t.shape_id] && !drawn.has(t.shape_id)){
      drawn.add(t.shape_id);
      const alt = S.routes[t.route_id].short!==pref.routes[0];
      L.polyline(S.shapes[t.shape_id],{color:alt?'#8c7f72':'#7a1f2e',weight:3,opacity:.6}).addTo(shapeLayer);
    }
  }
  for(const [id,s] of Object.entries(S.stops)){
    if(!s.lat) continue; bounds.push([s.lat,s.lon]);
    L.circleMarker([s.lat,s.lon],{radius:4,color:'#7a1f2e',weight:1.5,fillColor:'#fff',fillOpacity:1}).bindTooltip(s.name).addTo(stopLayer);
  }
  if(bounds.length){ S._bounds=bounds; map.fitBounds(bounds,{padding:[20,20]}); }
  }
function startTimer(){ if(timer) clearInterval(timer); timer=setInterval(refresh, pref.interval*1000); }

async function boot(force){
  try{
    hideMsg();
    await loadStatic(force);
    drawStatic();
    await refresh();
    startTimer();
  }catch(err){
    console.error(err);
    showMsg(err.message, true); setStatus('エラー');
  }
}

$('refreshBtn').addEventListener('click', refresh);
$('stop70').addEventListener('change', e=>{ pref.stops['70']=e.target.value.trim(); savePref(); renderHome(); });
$('stop71').addEventListener('change', e=>{ pref.stops['71']=e.target.value.trim(); savePref(); renderHome(); });
$('hubStop').addEventListener('change', e=>{ pref.hub=e.target.value.trim()||'福井駅'; savePref(); renderHome(); });
$('modeGo').addEventListener('click', ()=>{ pref.mode='go'; savePref(); renderHome(); });
$('modeBack').addEventListener('click', ()=>{ pref.mode='back'; savePref(); renderHome(); });
setInterval(()=>{ if(S) renderHome(); }, 10000);
$('mapwrap').addEventListener('toggle', ()=>{ if($('mapwrap').open){ setTimeout(()=>{ map.invalidateSize(); if(S&&S._bounds) map.fitBounds(S._bounds,{padding:[20,20]}); },50); } });
$('intervalSel').addEventListener('change', e=>{ pref.interval=+e.target.value; savePref(); startTimer(); });
$('routesInput').addEventListener('change', e=>{ pref.routes=e.target.value.split(/[,、\s]+/).map(s=>s.trim()).filter(Boolean); savePref(); boot(true); });
$('reloadStatic').addEventListener('click', ()=>boot(true));
$('showRoutes').addEventListener('click', ()=>{ if(S&&S.allShort) showMsg('時刻表データにある系統: '+S.allShort.join(' ')); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S) refresh(); });

pref.mode='go';
initMap();
boot(false);
})();
</script>
